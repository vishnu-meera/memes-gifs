<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Programming memes & GIFs for developers - scroll through the best dev humor">
  <meta name="theme-color" content="#0d1117">
  <title>DevMemes</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://meme-api.com" crossorigin>
  <link rel="preconnect" href="https://i.redd.it" crossorigin>
  <link rel="preconnect" href="https://preview.redd.it" crossorigin>
  <link rel="dns-prefetch" href="https://meme-api.com">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9}
    #root{height:100%}
    .loader{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px}
    .loader .spin{width:32px;height:32px;border:3px solid #21262d;border-top-color:#58a6ff;border-radius:50%;animation:s .7s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"><div class="loader"><div class="spin"></div><span>Loading...</span></div></div>
</body>
</html>
