<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#0d1117"/>

  <!-- Code brackets as eyes -->
  <text x="22" y="52" font-size="28" fill="#58a6ff" font-family="monospace" font-weight="bold">{</text>
  <text x="68" y="52" font-size="28" fill="#58a6ff" font-family="monospace" font-weight="bold">}</text>

  <!-- Laughing tears -->
  <circle cx="32" cy="58" r="4" fill="#f0b000"/>
  <circle cx="68" cy="58" r="4" fill="#f0b000"/>

  <!-- Big smile -->
  <path d="M30 65 Q50 85 70 65" stroke="#58a6ff" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
